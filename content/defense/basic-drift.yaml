id: basic-drift
name: "Basic Drift & Fold"
category: defense
subtitle: "3-man pad hit, shuffle up, diagonal fold, and connected 6-man line speed."
grid_description: "20m wide x 15m contact grid (3 pads, 3 rows behind start line)"
recommended_players: "9 to 15 lads in 3 rows + 3 pad holders"
equipment:
  - "3 Tackle Pads / Shields"
  - "9 Cones (3 pads, 3 start, 3 fold)"
  - "1 Whistle"

contact_lanes:
  - id: left
    name: "Left"
    cones: { pad: orange, start: orange }
  - id: middle
    name: "Middle"
    cones: { pad: yellow, start: yellow }
  - id: right
    name: "Right"
    cones: { pad: orange, start: orange }

fold_lanes:
  - id: fold1
    name: "Fold 1"
    cone: yellow
  - id: fold2
    name: "Fold 2"
    cone: yellow
  - id: fold3
    name: "Fold 3"
    cone: orange

lines:
  pad_line: "PAD LINE (CONTACT ZONE)"
  start_line: "DEFENSIVE START LINE"

squads:
  pad_holders:
    count: 3
  defenders:
    sets:
      - id: set1
        name: "1st Set"
      - id: set2
        name: "2nd Set"
      - id: set3
        name: "3rd Set"

flow:
  - step: 1
    title: "Setup: 3 Pads Facing 3 Rows on Line"
    desc: "3 lads hold tackle pads 12m ahead. Facing them are defenders in 3 rows on the line. 1st set is on the line, calling 'ready, ready'."
    dur: 950
    call: { who: "1st Set - Middle", text: "ready, ready" }
    tip: "Call 'ready, ready' on the line before moving. Equal 12m spacing across the 3 lads."
    positions:
      set1: line
      set2: row2
      set3: row3

  - step: 2
    title: "1) 1st Set Comes Forward & Hits Pads"
    desc: "First set of 3 lads calls 'ready, ready' and goes forward on call of 'up', hitting the pads together."
    dur: 1100
    call: { who: "1st Set - Middle", text: "up" }
    tip: "Explode forward together on 'up' and drive through the pads."
    positions:
      set1: hit_pads
      set2: row2
      set3: row3

  - step: 3
    title: "2) 2nd Set Shuffles Up to the Line"
    desc: "2nd set of 3 lads shuffles up to the line calling 'ready, ready'. 3rd set steps up into Row 2."
    dur: 1000
    call: { who: "2nd Set - Middle", text: "ready, ready" }
    tip: "Feet set on the line calling 'ready, ready', maintaining equal 12m spacing."
    positions:
      set1: hold_pads
      set2: line
      set3: row2

  - step: 4
    title: "3) 1st Set Folds Diagonally Back Beside 2nd Set"
    desc: "After hitting, first set of lads comes diagonally backwards beside 2nd set on the line, calling 'fold'. Their spacing remains the same — they do not close up tight."
    dur: 1200
    call: { who: "1st Set - Middle", text: "fold" }
    tip: "Maintain exact 12m spacing when running diagonally back beside the 2nd set on the line. Do not bunch together!"
    positions:
      set1: fold
      set2: line
      set3: row2

  - step: 5
    title: "4) 2nd & 1st Set Come Up Together (2nd Set Hits Pads)"
    desc: "2nd and 1st set of lads come together on the call of 'up' as a 6-man defensive line. 2nd set hits the pads while 1st set holds connection."
    dur: 1150
    call: { who: "2nd Set - Middle", text: "up" }
    tip: "Leave the line together on 'up' as a connected flat wall with equal spacing across all 6 lads."
    positions:
      set1: fold_advance
      set2: hit_pads
      set3: creep

  - step: 6
    title: "5) 1st Set Queues Back; 3rd Set Up; 2nd Set Folds Beside 3rd"
    desc: "1st set of lads moves to back of queue. 3rd set shuffles up to the line, and 2nd set moves diagonally back beside 3rd set calling 'fold', keeping equal spacing."
    dur: 1200
    call: { who: "2nd Set - Middle", text: "fold" }
    tip: "2nd set keeps wide 12m spacing while folding beside the 3rd set."
    positions:
      set1: row3
      set2: fold
      set3: line

cues:
  - "Call 'ready, ready' on the line before moving"
  - "Explode together on 'up' as a connected flat wall"
  - "Maintain wide 12m spacing when folding beside the next set — never bunch together"

remember:
  - "CALL READY READY: On the line before moving"
  - "UP TOGETHER: Explode together on 'up' as a 6-man wall"
  - "FOLD WIDE: Keep 12m spacing when folding beside the next set — never close up tight"

coach_questions:
  - "Did the lads call 'ready, ready' on the line before moving?"
  - "Did the line come up flat together without dogslegs?"
  - "Did folding defenders keep full spacing beside the set on the line?"
